<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>MOKA — Investeerdersbrochure (PDF) | UTAMA</title>
<meta name="description" content="Bekijk en download de investeerdersbrochure van MOKA, Kedungu, Bali. Direct te bekijken, geen registratie nodig.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Publieke, ongegateerde PDF-viewer - bewust een los, minimalistisch
     "kijkvenster" (géén site-nav, géén leadformulier): deze link wordt
     direct naar leads gestuurd en moet zonder gegevens achterlaten
     meteen de brochure tonen, met een vertrouwde "Google Drive"-achtige
     leeservaring (vaste werkbalk, doorlopend scrollen, zoom, download).
     Gerenderd met een self-hosted pdf.js (/vendor/pdfjs/) i.p.v. de
     kale browser-PDF-viewer, omdat leads deze link vaak openen in een
     in-app browser (WhatsApp/Instagram) die PDF's niet native toont. */
  html,body{height:100%}
  body{margin:0;background:var(--sand-2);overflow:hidden;display:flex;flex-direction:column}

  .pv-topbar{flex:none;z-index:40;background:rgba(254,251,246,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:56px;box-sizing:border-box}
  .pv-brand{font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;flex:none}
  .pv-brand span{color:var(--opt-deep)}
  .pv-divider{width:1px;height:22px;background:var(--line);flex:none}
  .pv-title{font-size:13.5px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .pv-tools{display:flex;align-items:center;gap:4px;flex:none}
  .pv-btn{border:none;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s}
  .pv-btn:hover{background:var(--sand-2);color:var(--ink)}
  .pv-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pv-zoom-lbl{font-size:12.5px;font-weight:700;color:var(--ink);min-width:42px;text-align:center;user-select:none}
  .pv-download{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;font-family:inherit;font-weight:600;font-size:13px;padding:9px 15px;border-radius:8px;text-decoration:none;white-space:nowrap;transition:background .15s}
  .pv-download:hover{background:#000}
  .pv-download svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  @media(max-width:640px){
    .pv-title,.pv-zoom-lbl{display:none}
    .pv-download span{display:none}
    .pv-download{padding:9px;border-radius:50%}
  }

  .pv-viewport{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pv-pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 14px 60px;min-height:100%;box-sizing:border-box}
  .pv-page{background:#fff;box-shadow:0 2px 10px rgba(23,20,15,.14),0 0 0 1px rgba(23,20,15,.05);position:relative;flex:none}
  .pv-page canvas{display:block;width:100%;height:100%}
  .pv-page .pv-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .pv-page .pv-ph .spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--opt-deep);animation:pvspin .8s linear infinite}
  @keyframes pvspin{to{transform:rotate(360deg)}}

  .pv-counter{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;background:rgba(23,20,15,.85);color:#fff;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s}
  .pv-counter.show{opacity:1}

  .pv-err{max-width:420px;margin:80px auto;text-align:center;padding:0 20px;color:var(--muted);font-size:14px;line-height:1.6}
  .pv-err a{color:var(--ink);font-weight:700}
</style>
</head>
<body>

<header class="pv-topbar">
  <span class="pv-brand">UT<span>A</span>MA</span>
  <div class="pv-divider"></div>
  <span class="pv-title" id="pvTitle">MOKA — Investeerdersbrochure</span>
  <div class="pv-tools">
    <button class="pv-btn" id="pvZoomOut" title="Uitzoomen" aria-label="Uitzoomen">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
    </button>
    <span class="pv-zoom-lbl" id="pvZoomLbl">100%</span>
    <button class="pv-btn" id="pvZoomIn" title="Inzoomen" aria-label="Inzoomen">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
    </button>
  </div>
  <a class="pv-download" id="pvDownload" href="/moka/brochure/UTAMA-MOKA-Investeerdersbrochure.pdf?v=20260803a" download="UTAMA-MOKA-Investeerdersbrochure.pdf">
    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    <span>Download</span>
  </a>
</header>

<main class="pv-viewport" id="pvViewport">
  <div class="pv-pages" id="pvPages"></div>
</main>

<div class="pv-counter" id="pvCounter">1 / 1</div>

<script type="module">
import * as pdfjsLib from '/vendor/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';

const PDF_URL = '/moka/brochure/UTAMA-MOKA-Investeerdersbrochure.pdf?v=20260803a';

const pagesEl = document.getElementById('pvPages');
const viewportEl = document.getElementById('pvViewport');
const zoomLbl = document.getElementById('pvZoomLbl');
const counterEl = document.getElementById('pvCounter');

let pdfDoc = null;
let baseScale = 1;      // scale at which "100%" == fit-to-width
let zoomFactor = 1;     // user-chosen multiplier on top of baseScale
let pageEntries = [];   // {container, canvas, page, rendered, rendering, num}
let counterTimer = null;

function fmtZoom(){ return Math.round(zoomFactor*100)+'%'; }

async function init(){
  try{
    const loadingTask = pdfjsLib.getDocument({
      url: PDF_URL,
      cMapUrl: '/vendor/pdfjs/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: '/vendor/pdfjs/standard_fonts/'
    });
    pdfDoc = await loadingTask.promise;
    const first = await pdfDoc.getPage(1);
    const nat = first.getViewport({ scale: 1 });
    const available = Math.min(viewportEl.clientWidth - 28, 900);
    baseScale = Math.max(available / nat.width, 0.2);

    for(let n=1;n<=pdfDoc.numPages;n++){
      const container = document.createElement('div');
      container.className = 'pv-page';
      container.dataset.num = n;
      const w = nat.width*baseScale, h = nat.height*baseScale;
      container.style.width = w+'px';
      container.style.height = h+'px';
      const ph = document.createElement('div');
      ph.className = 'pv-ph';
      ph.innerHTML = '<div class="spin"></div>';
      container.appendChild(ph);
      pagesEl.appendChild(container);
      pageEntries.push({ container, canvas:null, ph, num:n, rendered:false, rendering:false });
    }
    zoomLbl.textContent = fmtZoom();
    observePages();
    renderVisible();
  }catch(err){
    console.error('pdf load error', err);
    pagesEl.innerHTML = '<div class="pv-err">Kon de brochure niet laden. <a href="'+PDF_URL+'">Open het PDF-bestand direct</a>.</div>';
  }
}

let io;
function observePages(){
  io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const entry = pageEntries.find(p=>p.container===e.target);
        if(entry) renderPage(entry);
      }
    });
  }, { root: viewportEl, rootMargin: '1200px 0px 1200px 0px' });
  pageEntries.forEach(p=>io.observe(p.container));
}

async function renderPage(entry){
  if(entry.rendered || entry.rendering) return;
  entry.rendering = true;
  const page = await pdfDoc.getPage(entry.num);
  const scale = baseScale*zoomFactor;
  const viewport = page.getViewport({ scale });
  let canvas = entry.canvas;
  if(!canvas){
    canvas = document.createElement('canvas');
    entry.container.insertBefore(canvas, entry.ph);
    entry.canvas = canvas;
  }
  const outputScale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(viewport.width*outputScale);
  canvas.height = Math.floor(viewport.height*outputScale);
  canvas.style.width = viewport.width+'px';
  canvas.style.height = viewport.height+'px';
  const ctx = canvas.getContext('2d');
  const transform = outputScale!==1 ? [outputScale,0,0,outputScale,0,0] : null;
  await page.render({ canvasContext: ctx, viewport, transform }).promise;
  entry.rendered = true;
  entry.rendering = false;
  entry.ph.style.display = 'none';
}

function renderVisible(){
  // force-render whatever is already in view on first paint (IO fires async)
  pageEntries.forEach(entry=>{
    const r = entry.container.getBoundingClientRect();
    const vr = viewportEl.getBoundingClientRect();
    if(r.bottom > vr.top - 400 && r.top < vr.bottom + 400) renderPage(entry);
  });
}

async function applyZoom(newFactor){
  zoomFactor = Math.max(0.5, Math.min(2.5, newFactor));
  zoomLbl.textContent = fmtZoom();
  for(const entry of pageEntries){
    const page = await pdfDoc.getPage(entry.num);
    const nat = page.getViewport({ scale: 1 });
    const w = nat.width*baseScale*zoomFactor, h = nat.height*baseScale*zoomFactor;
    entry.container.style.width = w+'px';
    entry.container.style.height = h+'px';
    entry.rendered = false;
  }
  renderVisible();
}

document.getElementById('pvZoomIn').addEventListener('click', ()=>applyZoom(zoomFactor+0.25));
document.getElementById('pvZoomOut').addEventListener('click', ()=>applyZoom(zoomFactor-0.25));

let scrollT=null;
viewportEl.addEventListener('scroll', ()=>{
  renderVisible();
  const mid = viewportEl.scrollTop + viewportEl.clientHeight/2;
  let current = 1;
  for(const entry of pageEntries){
    if(entry.container.offsetTop <= mid) current = entry.num;
  }
  counterEl.textContent = current+' / '+(pdfDoc?pdfDoc.numPages:'…');
  counterEl.classList.add('show');
  clearTimeout(counterTimer);
  counterTimer = setTimeout(()=>counterEl.classList.remove('show'), 1200);
  clearTimeout(scrollT);
});

let resizeT=null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeT);
  resizeT = setTimeout(async ()=>{
    if(!pdfDoc) return;
    const first = await pdfDoc.getPage(1);
    const nat = first.getViewport({ scale: 1 });
    const available = Math.min(viewportEl.clientWidth - 28, 900);
    baseScale = Math.max(available / nat.width, 0.2);
    applyZoom(zoomFactor);
  }, 200);
});

init();
</script>
<script src="/t.js" defer></script>
</body>
</html>
